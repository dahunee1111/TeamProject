<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCTV 설정</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
    }

    .blue { background: #2563eb; }
    .green { background: #16a34a; }
    .red { background: #dc2626; }
    .gray { background: #4b5563; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .active { background: #16a34a; }
    .inactive { background: #dc2626; }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <h1>CCTV 설정</h1>
        <p class="muted">카메라 이름과 위치를 등록/수정/삭제합니다.</p>
      </div>

      <div>
        <button class="blue" id="mainBtn">메인</button>
        <button class="gray" id="adminBtn">관리자 대시보드</button>
        <button class="red" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="card">
      <h2>CCTV 등록</h2>

      <input
        type="text"
        id="cameraNameInput"
        placeholder="예: CAM-01"
      />

      <input
        type="text"
        id="cameraLocationInput"
        placeholder="예: 서울역 1번 출구"
      />

      <button class="green" id="createBtn">CCTV 등록</button>
      <div class="muted" id="createStatus"></div>
    </div>

    <div class="card">
      <h2>CCTV 목록</h2>

      <button class="blue" id="reloadBtn">목록 새로고침</button>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>카메라 이름</th>
              <th>위치</th>
              <th>상태</th>
              <th>수정</th>
              <th>삭제</th>
            </tr>
          </thead>

          <tbody id="cameraTableBody">
            <tr>
              <td colspan="6" class="muted">CCTV 목록을 불러오는 중입니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";
    const FRONT_LOGIN_URL = "http://127.0.0.1:5500/frontend/login.html";

    const accessToken = localStorage.getItem("accessToken");
    const loggedInUserRaw = localStorage.getItem("loggedInUser");
    const loggedInUser = loggedInUserRaw ? JSON.parse(loggedInUserRaw) : null;

    if (!accessToken || !loggedInUser) {
      alert("로그인이 필요합니다.");
      window.location.href = FRONT_LOGIN_URL;
    }

    if (loggedInUser.role !== "admin") {
      alert("관리자 권한이 필요합니다.");
      window.location.href = "http://127.0.0.1:5500/frontend/index.html";
    }

    function authHeaders(extraHeaders = {}) {
      return {
        ...extraHeaders,
        "Authorization": `Bearer ${accessToken}`
      };
    }

    const cameraNameInput = document.getElementById("cameraNameInput");
    const cameraLocationInput = document.getElementById("cameraLocationInput");
    const createBtn = document.getElementById("createBtn");
    const createStatus = document.getElementById("createStatus");
    const reloadBtn = document.getElementById("reloadBtn");
    const cameraTableBody = document.getElementById("cameraTableBody");

    const mainBtn = document.getElementById("mainBtn");
    const adminBtn = document.getElementById("adminBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    async function loadCameras() {
      try {
        const response = await fetch(`${BASE_URL}/cctv/`, {
          method: "GET",
          headers: authHeaders()
        });

        if (!response.ok) {
          throw new Error("CCTV 목록 조회 실패");
        }

        const result = await response.json();
        const cameras = result.data || [];

        if (cameras.length === 0) {
          cameraTableBody.innerHTML = `
            <tr>
              <td colspan="6" class="muted">등록된 CCTV가 없습니다.</td>
            </tr>
          `;
          return;
        }

        cameraTableBody.innerHTML = cameras.map(camera => `
          <tr>
            <td>${camera.id}</td>
            <td>
              <input id="name-${camera.id}" value="${camera.camera_name}" />
            </td>
            <td>
              <input id="location-${camera.id}" value="${camera.camera_location}" />
            </td>
            <td>
              <select id="active-${camera.id}">
                <option value="true" ${camera.is_active ? "selected" : ""}>active</option>
                <option value="false" ${!camera.is_active ? "selected" : ""}>inactive</option>
              </select>
            </td>
            <td>
              <button class="blue" onclick="updateCamera(${camera.id})">수정</button>
            </td>
            <td>
              <button class="red" onclick="deleteCamera(${camera.id})">삭제</button>
            </td>
          </tr>
        `).join("");

      } catch (error) {
        cameraTableBody.innerHTML = `
          <tr>
            <td colspan="6">오류: ${error.message}</td>
          </tr>
        `;
      }
    }

    createBtn.addEventListener("click", async () => {
      const cameraName = cameraNameInput.value.trim();
      const cameraLocation = cameraLocationInput.value.trim();

      if (!cameraName || !cameraLocation) {
        createStatus.textContent = "카메라 이름과 위치를 모두 입력해주세요.";
        return;
      }

      try {
        const response = await fetch(`${BASE_URL}/cctv/`, {
          method: "POST",
          headers: authHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify({
            camera_name: cameraName,
            camera_location: cameraLocation
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || "CCTV 등록 실패");
        }

        createStatus.textContent = "CCTV 등록 성공";

        cameraNameInput.value = "";
        cameraLocationInput.value = "";

        await loadCameras();

      } catch (error) {
        createStatus.textContent = `오류: ${error.message}`;
      }
    });

    async function updateCamera(cameraId) {
      const cameraName = document.getElementById(`name-${cameraId}`).value.trim();
      const cameraLocation = document.getElementById(`location-${cameraId}`).value.trim();
      const isActive = document.getElementById(`active-${cameraId}`).value === "true";

      try {
        const response = await fetch(`${BASE_URL}/cctv/${cameraId}`, {
          method: "PATCH",
          headers: authHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify({
            camera_name: cameraName,
            camera_location: cameraLocation,
            is_active: isActive
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || "CCTV 수정 실패");
        }

        alert("CCTV 정보가 수정되었습니다.");
        await loadCameras();

      } catch (error) {
        alert(`오류: ${error.message}`);
      }
    }

    async function deleteCamera(cameraId) {
      if (!confirm("정말 삭제할까요?")) {
        return;
      }

      try {
        const response = await fetch(`${BASE_URL}/cctv/${cameraId}`, {
          method: "DELETE",
          headers: authHeaders()
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.detail || "CCTV 삭제 실패");
        }

        alert("CCTV가 삭제되었습니다.");
        await loadCameras();

      } catch (error) {
        alert(`오류: ${error.message}`);
      }
    }

    mainBtn.addEventListener("click", () => {
      window.location.href = "http://127.0.0.1:5500/frontend/index.html";
    });

    adminBtn.addEventListener("click", () => {
      window.location.href = "http://127.0.0.1:5500/frontend/admin.html";
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("accessToken");
      localStorage.removeItem("loggedInUser");
      alert("로그아웃 되었습니다.");
      window.location.href = FRONT_LOGIN_URL;
    });

    reloadBtn.addEventListener("click", loadCameras);

    loadCameras();
  </script>
</body>
</html>
