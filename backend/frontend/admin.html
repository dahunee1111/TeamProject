<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 1300px;
      margin: 40px auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
    }

    .title {
      font-size: 34px;
      font-weight: 800;
    }

    .subtitle {
      color: #666;
      margin-top: 8px;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-btn {
      background: #2563eb;
    }

    .logout-btn {
      background: #dc2626;
    }

    .refresh-btn {
      background: #16a34a;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 18px;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .value {
      font-size: 28px;
      font-weight: 800;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 14px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: #374151;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    .badge-admin {
      background: #7c3aed;
    }

    .badge-user {
      background: #2563eb;
    }

    .badge-danger {
      background: #dc2626;
    }

    .badge-warning {
      background: #f59e0b;
    }

    .badge-safe {
      background: #16a34a;
    }

    .badge-upload {
      background: #7c3aed;
    }

    .badge-realtime {
      background: #0891b2;
    }

    .muted {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 16px;
    }

    .chart-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
    }

    .chart-box h3 {
      margin-top: 0;
      font-size: 16px;
    }

    @media (max-width: 900px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="top-bar">
      <div>
        <div class="title">관리자 대시보드</div>
        <div class="subtitle">
          전체 사용자 / 전체 분석 로그 / 위험 탐지 현황
        </div>
      </div>

      <div class="button-group">
        <button class="refresh-btn" id="refreshBtn">새로고침</button>
        <button class="main-btn" id="mainBtn">메인</button>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <div class="card">
      <h2>시스템 통계</h2>

      <div class="grid">
        <div class="info-box">
          <div class="label">전체 사용자 수</div>
          <div class="value" id="userCount">0</div>
        </div>

        <div class="info-box">
          <div class="label">전체 분석 기록</div>
          <div class="value" id="analysisCount">0</div>
        </div>

        <div class="info-box">
          <div class="label">위험 탐지 수</div>
          <div class="value" id="dangerCount">0</div>
        </div>

        <div class="info-box">
          <div class="label">실시간 CCTV 기록</div>
          <div class="value" id="realtimeCount">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>전체 사용자 목록</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>상태</th>
            </tr>
          </thead>

          <tbody id="userTableBody">
            <tr>
              <td colspan="5" class="muted">
                사용자 데이터를 불러오는 중입니다.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
     
    <div class="card">
      <h2>관리자 통계 그래프</h2>

      <div class="chart-grid">

        <div class="chart-box">
          <h3>위험도 분포</h3>
          <canvas id="riskChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>업로드 / 실시간 비율</h3>
          <canvas id="sourceChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>액션 유형별 통계</h3>
          <canvas id="actionChart"></canvas>
        </div>

        <div class="chart-box">
          <h3>위험물체 TOP 5</h3>
          <canvas id="objectChart"></canvas>
        </div>

      </div>
    </div>
    <div class="card">
      <h2>전체 분석 기록</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>구분</th>
              <th>CCTV</th>
              <th>위치</th>
              <th>시간</th>
              <th>Video ID</th>
              <th>행동</th>
              <th>물체</th>
              <th>위험도</th>
              <th>액션</th>
            </tr>
          </thead>

          <tbody id="analysisTableBody">
            <tr>
              <td colspan="9" class="muted">
                분석 기록을 불러오는 중입니다.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";

    const accessToken = localStorage.getItem("accessToken");
    const loggedInUserRaw = localStorage.getItem("loggedInUser");

    if (!accessToken || !loggedInUserRaw) {
      alert("로그인이 필요합니다.");
      window.location.href =
        "http://127.0.0.1:5500/frontend/login.html";
    }

    const loggedInUser = JSON.parse(loggedInUserRaw);

    if (loggedInUser.role !== "admin") {
      alert("관리자 권한이 필요합니다.");
      window.location.href =
        "http://127.0.0.1:5500/frontend/index.html";
    }

    function authHeaders(extraHeaders = {}) {
      return {
        ...extraHeaders,
        "Authorization": `Bearer ${accessToken}`
      };
    }

    const userCount = document.getElementById("userCount");
    const analysisCount = document.getElementById("analysisCount");
    const dangerCount = document.getElementById("dangerCount");
    const realtimeCount = document.getElementById("realtimeCount");

    const userTableBody = document.getElementById("userTableBody");
    const analysisTableBody = document.getElementById("analysisTableBody");
    
    let riskChart = null;
    let sourceChart = null;
    let actionChart = null;
    let objectChart = null;
    const refreshBtn = document.getElementById("refreshBtn");
    const mainBtn = document.getElementById("mainBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function formatDateTime(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString("ko-KR");
    }

    function isRealtimeRow(row) {
      return String(row.video_id || "")
        .startsWith("realtime-");
    }

    function sourceBadge(row) {
      if (isRealtimeRow(row)) {
        return '<span class="badge badge-realtime">실시간</span>';
      }

      return '<span class="badge badge-upload">업로드</span>';
    }

    function riskBadge(score) {
      if (score >= 60) {
        return '<span class="badge badge-danger">위험</span>';
      }

      if (score >= 30) {
        return '<span class="badge badge-warning">주의</span>';
      }

      return '<span class="badge badge-safe">안전</span>';
    }

    function destroyCharts() {
      if (riskChart) riskChart.destroy();
      if (sourceChart) sourceChart.destroy();
      if (actionChart) actionChart.destroy();
      if (objectChart) objectChart.destroy();
    }

    function renderAdminCharts(rows) {
      destroyCharts();

      const safeCount = rows.filter(
        row => Number(row.risk_score) < 30
      ).length;

      const warningCount = rows.filter(
        row =>
          Number(row.risk_score) >= 30 &&
          Number(row.risk_score) < 60
      ).length;

      const dangerCount = rows.filter(
        row => Number(row.risk_score) >= 60
      ).length;

      const uploadCount = rows.filter(
        row => !String(row.video_id || "").startsWith("realtime-")
      ).length;

      const realtimeCountValue = rows.filter(
        row => String(row.video_id || "").startsWith("realtime-")
      ).length;

      const actionCounts = {};
      const objectCounts = {};

      rows.forEach(row => {
        const action = row.action || "none";

        actionCounts[action] =
          (actionCounts[action] || 0) + 1;

        if (row.object_detected && row.object_label) {
          objectCounts[row.object_label] =
            (objectCounts[row.object_label] || 0) + 1;
        }
      });

      const objectEntries = Object.entries(objectCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      riskChart = new Chart(
        document.getElementById("riskChart"),
        {
          type: "bar",
          data: {
            labels: ["안전", "주의", "위험"],
            datasets: [{
              label: "건수",
              data: [
                safeCount,
                warningCount,
                dangerCount
              ]
            }]
          }
        }
      );

      sourceChart = new Chart(
        document.getElementById("sourceChart"),
        {
          type: "doughnut",
          data: {
            labels: ["업로드", "실시간"],
            datasets: [{
              data: [
                uploadCount,
                realtimeCountValue
              ]
            }]
          }
        }
      );

  actionChart = new Chart(
    document.getElementById("actionChart"),
    {
      type: "bar",
      data: {
        labels: Object.keys(actionCounts),
        datasets: [{
          label: "액션 건수",
          data: Object.values(actionCounts)
        }]
      }
    }
  );

  objectChart = new Chart(
    document.getElementById("objectChart"),
    {
      type: "bar",
      data: {
        labels: objectEntries.map(v => v[0]),
        datasets: [{
          label: "탐지 횟수",
          data: objectEntries.map(v => v[1])
        }]
      }
    }
  );
}
    
    async function loadUsers() {
      try {
        const response = await fetch(
          `${BASE_URL}/admin/users`,
          {
            method: "GET",
            headers: authHeaders()
          }
        );

        if (!response.ok) {
          throw new Error("사용자 조회 실패");
        }

        const result = await response.json();
        const users = result.data || [];

        userCount.textContent = users.length;

        if (users.length === 0) {
          userTableBody.innerHTML = `
            <tr>
              <td colspan="5" class="muted">
                사용자 데이터가 없습니다.
              </td>
            </tr>
          `;
          return;
        }

        userTableBody.innerHTML = users.map(user => `
          <tr>
            <td>${user.id}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>
              ${
                user.role === "admin"
                  ? '<span class="badge badge-admin">admin</span>'
                  : '<span class="badge badge-user">user</span>'
              }
            </td>
            <td>
              ${
                user.is_active
                  ? '<span class="badge badge-safe">active</span>'
                  : '<span class="badge badge-danger">inactive</span>'
              }
            </td>
          </tr>
        `).join("");

      } catch (error) {
        userTableBody.innerHTML = `
          <tr>
            <td colspan="5">
              오류: ${error.message}
            </td>
          </tr>
        `;
      }
    }

    async function loadAnalysis() {
      try {
        const response = await fetch(
          `${BASE_URL}/admin/analysis`,
          {
            method: "GET",
            headers: authHeaders()
          }
        );

        if (!response.ok) {
          throw new Error("분석 기록 조회 실패");
        }

        const result = await response.json();
        const rows = result.data || [];
        renderAdminCharts(rows);

        analysisCount.textContent = rows.length;

        const dangerRows = rows.filter(
          row => row.risk_score >= 30
        );

        dangerCount.textContent = dangerRows.length;

        const realtimeRows = rows.filter(
          row => isRealtimeRow(row)
        );

        realtimeCount.textContent = realtimeRows.length;

        if (rows.length === 0) {
          analysisTableBody.innerHTML = `
            <tr>
              <td colspan="9" class="muted">
                분석 기록이 없습니다.
              </td>
            </tr>
          `;
          return;
        }

        analysisTableBody.innerHTML = rows.map(row => {
          const behaviorText =
            row.behavior_result === 1
              ? "이상"
              : "정상";

          const objectText =
            row.object_detected
              ? row.object_label
              : "없음";

          return `
            <tr>
              <td>${sourceBadge(row)}</td>
              <td>${row.camera_name || "-"}</td>
              <td>${row.camera_location || "-"}</td>
              <td>${formatDateTime(row.created_at)}</td>
              <td>${row.video_id}</td>
              <td>${behaviorText}</td>
              <td>${objectText}</td>
              <td>${riskBadge(row.risk_score)}</td>
              <td>${row.action}</td>
            </tr>
          `;
        }).join("");

      } catch (error) {
        analysisTableBody.innerHTML = `
          <tr>
            <td colspan="9">
              오류: ${error.message}
            </td>
          </tr>
        `;
      }
    }

    async function refreshDashboard() {
      await loadUsers();
      await loadAnalysis();
    }

    refreshBtn.addEventListener("click", refreshDashboard);

    mainBtn.addEventListener("click", () => {
      window.location.href =
        "http://127.0.0.1:5500/frontend/index.html";
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("accessToken");
      localStorage.removeItem("loggedInUser");

      alert("로그아웃 되었습니다.");

      window.location.href =
        "http://127.0.0.1:5500/frontend/login.html";
    });

    refreshDashboard();
  </script>
</body>
</html>
