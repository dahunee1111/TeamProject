<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 - AI 이상행동 감지 시스템</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    button, a.button {
      display: inline-block;
      background: #1f6feb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-left: 8px;
    }

    .logout-btn {
      background: #dc2626;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
    }

    .label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .value {
      font-size: 22px;
      font-weight: 800;
    }

    .status-text {
      margin-top: 12px;
      color: #555;
      font-size: 14px;
    }

    .table-wrap {
      margin-top: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: white;
    }

    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: #374151;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    .badge-user { background: #2563eb; }
    .badge-admin { background: #7c3aed; }
    .badge-active { background: #16a34a; }
    .badge-danger { background: #dc2626; }
    .badge-alert { background: #f59e0b; }
    .badge-broadcast { background: #2563eb; }
    .badge-none { background: #6b7280; }

    .source-upload { background: #7c3aed; }
    .source-realtime { background: #0891b2; }

    .muted {
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <div class="title">마이페이지</div>
        <div class="subtitle">
          내 계정 정보와 분석 기록을 확인합니다.
        </div>
      </div>

      <div>
        <a class="button" href="./index.html">메인으로</a>
        <button id="logoutBtn" class="logout-btn">로그아웃</button>
      </div>
    </div>

    <div class="card">
      <h2>내 계정 정보</h2>

      <div class="grid">
        <div class="info-box">
          <div class="label">사용자명</div>
          <div class="value" id="username">-</div>
        </div>

        <div class="info-box">
          <div class="label">이메일</div>
          <div class="value" id="email">-</div>
        </div>

        <div class="info-box">
          <div class="label">권한</div>
          <div class="value" id="role">-</div>
        </div>

        <div class="info-box">
          <div class="label">계정 상태</div>
          <div class="value" id="accountStatus">활성</div>
        </div>
      </div>

      <div class="status-text" id="meStatus">내 정보 불러오는 중...</div>
    </div>

    <div class="card">
      <h2>내 분석 요약</h2>

      <div class="grid">
        <div class="info-box">
          <div class="label">총 분석 기록</div>
          <div class="value" id="totalCount">0</div>
        </div>

        <div class="info-box">
          <div class="label">업로드 영상 기록</div>
          <div class="value" id="uploadCount">0</div>
        </div>

        <div class="info-box">
          <div class="label">실시간 CCTV 기록</div>
          <div class="value" id="realtimeCount">0</div>
        </div>

        <div class="info-box">
          <div class="label">위험 탐지 기록</div>
          <div class="value" id="dangerCount">0</div>
        </div>
      </div>

      <div class="status-text" id="historyStatus">분석 기록 불러오는 중...</div>
    </div>

    <div class="card">
      <h2>내 최근 분석 기록</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>구분</th>
              <th>시간</th>
              <th>Video ID</th>
              <th>행동</th>
              <th>물체</th>
              <th>위험도</th>
              <th>액션</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr>
              <td colspan="7" class="muted">기록을 불러오는 중입니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "http://127.0.0.1:8000";
    const FRONT_LOGIN_URL = "http://127.0.0.1:5500/frontend/login.html";

    const accessToken = localStorage.getItem("accessToken");

    if (!accessToken) {
      alert("로그인이 필요합니다.");
      window.location.href = FRONT_LOGIN_URL;
    }

    function authHeaders(extraHeaders = {}) {
      return {
        ...extraHeaders,
        "Authorization": `Bearer ${accessToken}`
      };
    }

    function handleAuthError(response) {
      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem("accessToken");
        localStorage.removeItem("loggedInUser");

        alert("로그인이 만료되었거나 권한이 없습니다.");
        window.location.href = FRONT_LOGIN_URL;

        return true;
      }

      return false;
    }

    function formatDateTime(value) {
      if (!value) return "-";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString("ko-KR");
    }

    function isRealtimeRow(row) {
      return String(row.video_id || "").startsWith("realtime-");
    }

    function sourceBadge(row) {
      if (isRealtimeRow(row)) {
        return '<span class="badge source-realtime">실시간 CCTV</span>';
      }

      return '<span class="badge source-upload">업로드 영상</span>';
    }

    function actionBadge(action) {
      const map = {
        none: "badge badge-none",
        alert: "badge badge-alert",
        broadcast: "badge badge-broadcast",
        report: "badge badge-danger"
      };

      return `<span class="${map[action] || "badge badge-none"}">${action}</span>`;
    }

    async function loadMe() {
      const meStatus = document.getElementById("meStatus");

      try {
        const response = await fetch(`${BASE_URL}/auth/me`, {
          method: "GET",
          headers: authHeaders()
        });

        if (handleAuthError(response)) return;

        if (!response.ok) {
          throw new Error("내 정보 조회 실패");
        }

        const data = await response.json();
        const user = data.user;

        localStorage.setItem("loggedInUser", JSON.stringify(user));

        document.getElementById("username").textContent = user.username;
        document.getElementById("email").textContent = user.email;

        document.getElementById("role").innerHTML =
          user.role === "admin"
            ? '<span class="badge badge-admin">admin</span>'
            : '<span class="badge badge-user">user</span>';

        document.getElementById("accountStatus").innerHTML =
          '<span class="badge badge-active">active</span>';

        meStatus.textContent = "내 정보 조회 완료";
      } catch (error) {
        meStatus.textContent = `내 정보 오류: ${error.message}`;
      }
    }

    async function loadHistory() {
      const historyStatus = document.getElementById("historyStatus");
      const historyTableBody = document.getElementById("historyTableBody");

      try {
        const response = await fetch(`${BASE_URL}/history/`, {
          method: "GET",
          headers: authHeaders()
        });

        if (handleAuthError(response)) return;

        if (!response.ok) {
          throw new Error("분석 기록 조회 실패");
        }

        const result = await response.json();
        const rows = result.data || [];

        const uploadRows = rows.filter(row => !isRealtimeRow(row));
        const realtimeRows = rows.filter(row => isRealtimeRow(row));
        const dangerRows = rows.filter(row => row.risk_score >= 30);

        document.getElementById("totalCount").textContent = rows.length;
        document.getElementById("uploadCount").textContent = uploadRows.length;
        document.getElementById("realtimeCount").textContent = realtimeRows.length;
        document.getElementById("dangerCount").textContent = dangerRows.length;

        historyStatus.textContent = `총 ${rows.length}개의 내 기록이 있습니다.`;

        if (rows.length === 0) {
          historyTableBody.innerHTML = `
            <tr>
              <td colspan="7" class="muted">아직 내 분석 기록이 없습니다.</td>
            </tr>
          `;
          return;
        }

        historyTableBody.innerHTML = rows.map(row => {
          const behaviorText = row.behavior_result === 1 ? "이상" : "정상";
          const objectText = row.object_detected ? row.object_label : "없음";

          return `
            <tr>
              <td>${sourceBadge(row)}</td>
              <td>${formatDateTime(row.created_at)}</td>
              <td>${row.video_id}</td>
              <td>${behaviorText}</td>
              <td>${objectText}</td>
              <td>${row.risk_score}</td>
              <td>${actionBadge(row.action)}</td>
            </tr>
          `;
        }).join("");
      } catch (error) {
        historyStatus.textContent = `분석 기록 오류: ${error.message}`;
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("accessToken");
      localStorage.removeItem("loggedInUser");

      alert("로그아웃 되었습니다.");
      window.location.href = FRONT_LOGIN_URL;
    });

    loadMe();
    loadHistory();
  </script>
</body>
</html>
